services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gaiarp_dev
      POSTGRES_USER: gaiarp
      POSTGRES_PASSWORD: gaia_local_only
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - gaia_dev_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaiarp -d gaiarp_dev"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  gaia_dev_db:
