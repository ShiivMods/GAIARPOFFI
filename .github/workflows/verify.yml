name: Validation technique
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020e
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          if test -f package-lock.json; then npm ci; else npm install; fi
      - name: Verify historical assets
        run: npm run assets:check
      - name: Lint, typecheck and build
        run: npm run check
      - name: Local auth and combat tests
        run: npm test
      - name: Dependency audit
        run: npm audit --audit-level=moderate
