name: Import intégral des fichiers historiques
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-legacy-assets.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: import-historical-assets
  cancel-in-progress: false
jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020e
        with:
          node-version: '22'
      - name: Fetch immutable historical source
        run: |
          git init .legacy-import
          git -C .legacy-import fetch --depth=1 https://github.com/ShiivMods/GaiaRP.git 6a5324d5bea9758c94e19305bc8c3e25979897e8
          git -C .legacy-import checkout --detach FETCH_HEAD
          test "$(git -C .legacy-import rev-parse HEAD)" = "6a5324d5bea9758c94e19305bc8c3e25979897e8"
      - name: Copy original assets and archival configuration
        run: |
          node --input-type=module <<'JS'
          import {readFile,mkdir,copyFile} from "node:fs/promises";
          import {join,dirname} from "node:path";
          import {createHash} from "node:crypto";
          const m=JSON.parse(await readFile("migration/manifest.json","utf8"));
          for(const e of [...m.assets,...m.archive]){
            const from=join(".legacy-import",e.path);
            const to=m.assets.includes(e)?e.path:join("migration/reference",e.path);
            const bytes=await readFile(from);
            const sha=createHash("sha1").update("blob "+bytes.length+"\0").update(bytes).digest("hex");
            if(sha!==e.sha)throw Error("Historical checksum mismatch: "+e.path);
            await mkdir(dirname(to),{recursive:true});
            await copyFile(from,to);
          }
          for(const e of m.source){
            if(e.adapted)continue;
            const bytes=await readFile(e.target);
            const sha=createHash("sha1").update("blob "+bytes.length+"\0").update(bytes).digest("hex");
            if(sha!==e.sha)throw Error("Source checksum mismatch: "+e.target);
          }
          JS
          npm run assets:check
      - name: Commit exact historical files
        run: |
          git add -- public migration/reference
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import exact historical GAIA RP assets and reference files"
          git push origin HEAD:main
      - name: Validate restored application with original assets
        run: |
          if test -f package-lock.json; then npm ci; else npm install; fi
          npm run check
          npm test
          npm run assets:check
